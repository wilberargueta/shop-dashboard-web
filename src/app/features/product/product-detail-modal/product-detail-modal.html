<div class="product-detail-modal__backdrop" aria-hidden="true" (click)="onClose()"></div>
<div
  class="product-detail-modal__panel"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  appFocusTrap
  [returnFocusTo]="returnFocusTo()"
  (keydown.escape)="onClose()"
>
  <button type="button" class="product-detail-modal__close" (click)="onClose()">
    <span class="visually-hidden" i18n="@@productDetailModal.close">Cerrar</span>
    <span aria-hidden="true">×</span>
  </button>

  @if (product(); as product) {
    <app-product-detail-content [product]="product" [titleId]="titleId" />
  } @else if (hasError()) {
    <p class="product-detail-modal__error" i18n="@@productDetailModal.loadError">
      No se pudo cargar el producto. Inténtalo de nuevo más tarde.
    </p>
  } @else {
    <app-product-detail-skeleton />
  }
</div>
