<article class="product-detail-content">
  @if (images().length > 0) {
    <app-product-image-carousel class="product-detail-content__carousel" [images]="images()" />
  } @else {
    <picture class="product-detail-content__placeholder">
      <img src="/images/product-placeholder.svg" alt="" width="600" height="600" style="aspect-ratio: 1 / 1" />
    </picture>
  }

  <div class="product-detail-content__info">
    <h1 class="product-detail-content__name" [attr.id]="titleId()">{{ product().name }}</h1>

    <p class="product-detail-content__sku">
      <span i18n="@@productDetailContent.skuLabel">SKU</span>: {{ product().sku }}
    </p>

    <app-product-price
      [price]="product().price"
      [effectivePrice]="product().effectivePrice"
      [currency]="product().currency"
      [onSale]="product().onSale ?? false"
      [discountPercentage]="product().discountPercentage"
    />

    @if (product().inStock) {
      <p
        class="product-detail-content__availability product-detail-content__availability--in-stock"
        i18n="@@productDetailContent.inStock"
      >
        Disponible
      </p>
    } @else {
      <p
        class="product-detail-content__availability product-detail-content__availability--out-of-stock"
        i18n="@@productDetailContent.outOfStock"
      >
        Agotado
      </p>
    }

    <app-quantity-stepper [disabled]="product().inStock === false" />

    @if (product().description) {
      <div class="product-detail-content__description" [innerHTML]="product().description"></div>
    }

    @if (product().usageInstructions) {
      <section class="product-detail-content__usage">
        <h2 class="product-detail-content__usage-title" i18n="@@productDetailContent.usageTitle">
          Instrucciones de uso
        </h2>
        <div [innerHTML]="product().usageInstructions"></div>
      </section>
    }
  </div>
</article>
