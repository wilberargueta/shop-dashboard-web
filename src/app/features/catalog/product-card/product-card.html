<article class="product-card" [class.product-card--out-of-stock]="product().inStock === false">
  <a
    class="product-card__link"
    [attr.href]="detailHref()"
    [attr.aria-label]="product().name"
    (click)="onLinkClick($event)"
  >
    @if (cardImage(); as image) {
      <picture class="product-card__picture">
        @if (cardSrcsetWebp(); as webpSrcset) {
          <source type="image/webp" [srcset]="webpSrcset" [attr.sizes]="imageSizes" />
        }
        <img
          [src]="image.jpeg ?? image.webp"
          [srcset]="cardSrcsetFallback()"
          [attr.sizes]="imageSizes"
          [alt]="product().primaryImage?.altText ?? ''"
          [attr.width]="image.width ?? 600"
          [attr.height]="image.height ?? 600"
          [style.aspect-ratio]="image.width && image.height ? image.width + ' / ' + image.height : '1 / 1'"
          [attr.loading]="priority() ? 'eager' : 'lazy'"
          [attr.fetchpriority]="priority() ? 'high' : null"
          decoding="async"
        />
      </picture>
    } @else {
      <picture class="product-card__picture">
        <img
          src="/images/product-placeholder.svg"
          alt=""
          width="600"
          height="600"
          style="aspect-ratio: 1 / 1"
          [attr.loading]="priority() ? 'eager' : 'lazy'"
          [attr.fetchpriority]="priority() ? 'high' : null"
          decoding="async"
        />
      </picture>
    }

    <h3 class="product-card__name">{{ product().name }}</h3>

    <app-product-price
      [price]="product().price"
      [effectivePrice]="product().effectivePrice"
      [currency]="product().currency"
      [onSale]="product().onSale ?? false"
      [discountPercentage]="product().discountPercentage"
    />
  </a>

  @if (product().inStock === false) {
    <p class="product-card__badge product-card__badge--out-of-stock" i18n="@@productCard.outOfStock">Agotado</p>
    <button type="button" class="product-card__whatsapp-button" aria-disabled="true"
      [attr.aria-describedby]="outOfStockReasonId()"
    >
      <span i18n="@@productCard.whatsappButton">Consultar por WhatsApp</span>
    </button>
    <span [id]="outOfStockReasonId()" class="visually-hidden" i18n="@@productCard.outOfStockReason"
      >Agotado. No disponible para pedido por ahora.</span
    >
  }
</article>
