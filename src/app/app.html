<a class="skip-link" href="#main-content" i18n="@@app.skipToContent">Saltar al contenido</a>

<div [attr.inert]="selection.panelOpen() || whatsappPreview.open() ? '' : null">
  <app-site-header />
  <router-outlet />
</div>
<app-selection-root />
@defer (when whatsappPreview.open()) {
  @if (whatsappPreview.open()) {
    <app-whatsapp-preview-dialog
      [lines]="whatsappPreview.lines()"
      [returnFocusTo]="whatsappPreview.returnFocusTo()"
      (closed)="whatsappPreview.close()"
    />
  }
}
